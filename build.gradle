plugins {
    id 'java'
}

group 'com.vingame'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
    //maven { url 'https://jitpack.io' }
}

dependencies {
    //implementation 'com.github.therickys93:java-telegram-bot-api:3.1.0'
