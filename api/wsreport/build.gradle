plugins {
    id 'org.springframework.boot' version '2.4.8'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
}

group 'com.vingame'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
// https://mvnrepository.com/artifact/org.yeauty/netty-websocket-spring-boot-starter
    implementation group: 'org.yeauty', name: 'netty-websocket-spring-boot-starter', version: '0.11.0'
    implementation group: 'org.xerial.snappy', name: 'snappy-java', version: '1.1.8.4'
    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-log4j
    // https://mvnrepository.com/artifact/com.hazelcast/hazelcast
    implementation group: 'com.hazelcast', name: 'hazelcast', version: '3.6.4'
    // https://mvnrepository.com/artifact/org.projectlombok/lombok
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.20'
// https://mvnrepository.com/artifact/com.hazelcast/hazelcast-client
    implementation 'com.hazelcast:hazelcast-client:3.6.4'



}


