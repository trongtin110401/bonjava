
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	root /var/www/web;

	# Add index.php to the list if you are using PHP
	index index.html index.htm index.nginx-debian.html;

	server_name _;
	
	
	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/ =404;
		add_header Access-Control-Allow-Origin *;
	}
	
	location /data/kubet/taixiu {
		rewrite ^/data/kubet/taixiu$ /?ID=taixiua break;
		proxy_pass https://newjson.thietkewebcobac.com/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /data/kubet/xocdia {
		rewrite ^/data/kubet/xocdia$ /?ID=xocdiaa break;
		proxy_pass https://newjson.thietkewebcobac.com/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}		
	
	location /api-portal {
		proxy_pass http://10.40.112.4:8081/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
	}	
	
	location /socket-client/taixiu {
