
server {
	listen 443 ssl;
    server_name do79.club www.do79.club demo.do79.club;

    ssl_certificate /etc/letsencrypt/live/do79.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/do79.club/privkey.pem;

    root /var/www/web;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin *;
    }

	
	location /data/kubet/taixiu {
		rewrite ^/data/kubet/taixiu$ /?ID=taixiua break;
		proxy_pass https://newjson.thietkewebcobac.com/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /data/kubet/xocdia {
		rewrite ^/data/kubet/xocdia$ /?ID=xocdiaa break;
