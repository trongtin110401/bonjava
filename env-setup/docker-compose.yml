version: '3.3'
services:
  mysql:
    image: mysql:5.7
    restart: always
    container_name: mysql-game-db2
    environment:
      MYSQL_PASSWORD: '0Db20H9CP6T4jRNBB70bVTrf5o7IG9'
      MYSQL_ROOT_PASSWORD: '0Db20H9CP6T4jRNBB70bVTrf5o7IG9'
    ports:
      - '3306:3306'
    volumes:
      - /home/data/mysql:/var/lib/mysql
    networks:
      mynetwork:
        ipv4_address: 10.5.0.2
  mongo:
    image: mongo:4.0.16-xenial
    restart: always
    container_name: game-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: MgqzAtRymcxyNoFnkwX7sGUlmj0YQI
      MONGO_INITDB_DATABASE: win123club
    ports:
      - '27017-27019:27017-27019'
    command:
      - '--auth'
      - '-f'
      - '/configFolder/mongod.conf'
      - '--wiredTigerCacheSizeGB'
      - '1.5'
    volumes:
      - ./config/mongod:/configFolder
      - /home/data/mongo:/data/db
      - $PWD/replset88.key:/data/replica.key
    networks:
      mynetwork:
        ipv4_address: 10.5.0.3

    # hazelcast imdg
  hazelcast:
    image: hazelcast/hazelcast:3.12.5
    restart: always
    container_name: game-hazelcast
    volumes:
      - ./config/hazelcast:/configFolder
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      - JAVA_OPTS=-Dhazelcast.config=/configFolder/hazelcast.xml -Dgroup.name=dev -Dgroup.password=MgqzAtRymcxyNoFnkwX7sGUlmj0YQI
    ports:
      - '5701:5701'
    networks:
      mynetwork:
        ipv4_address: 10.5.0.4

    # rabbitmq
  rabbitmq:
    image: 'rabbitmq:3.8.3-management'
    restart: always
    container_name: game-rabbitmq
    environment:
      - "RABBITMQ_DEFAULT_USER=demo"
      - "RABBITMQ_DEFAULT_PASS=MgqzAtRymcxyNoFnkwX7sGUlmj0YQI"
      - "RABBITMQ_VM_MEMORY_HIGH_WATERMARK=0.31"
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      mynetwork:
        ipv4_address: 10.5.0.5

  # redis
  redis:
    image: bitnami/redis:latest
    ports:
      - '6379:6379'
    expose:
      - 6379
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_PASSWORD=hiBONwin
      - REDIS_AOF_ENABLED=yes
    volumes:
      - /home/data/redis:/bitnami/redis/data
    restart: always
    networks:
      mynetwork:
        ipv4_address: 10.5.0.6

