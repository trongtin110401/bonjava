name: Auto Pull Code to VPS

on:
  push:
    branches:
      - remove_elk   # ✅ Tự chạy khi push lên nhánh remove_elk

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH into VPS and pull latest code
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          insecure: true   # 👈 Bỏ qua kiểm tra fingerprint để đỡ bị host key error
          script: |
            echo "==== PULLING LATEST CODE ===="
            cd /home/game/bonjava || exit 1
            git fetch origin remove_elk
            git reset --hard origin/remove_elk
            echo "==== DEPLOY DONE ===="
